<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global FX Board — Currencies vs the US Dollar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1420;--panel:#161E2E;--panel-2:#1C2739;--line:#26324A;
    --text:#E8EDF4;--muted:#7C8AA0;--up:#3FB984;--down:#E5624D;--gold:#E0B04A;
    --display:'Space Grotesk',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{background:var(--ink);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;line-height:1.4}
  .wrap{max-width:1080px;margin:0 auto;padding:32px 20px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .eyebrow::after{content:"";height:1px;width:120px;background:linear-gradient(90deg,var(--line),transparent)}
  h1{font-family:var(--display);font-weight:600;font-size:clamp(28px,5vw,46px);line-height:1.02;margin:0 0 6px;letter-spacing:-.01em}
  h1 .buck{color:var(--gold)}
  .sub{color:var(--muted);font-size:14px;max-width:62ch}
  .meta{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:14px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--up);display:inline-block;margin-right:6px;box-shadow:0 0 0 3px rgba(63,185,132,.15)}
  .lang{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;flex-shrink:0}
  .lang button{background:none;border:none;color:var(--muted);font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;padding:6px 10px;border-radius:6px;cursor:pointer}
  .lang button.on{background:var(--gold);color:#1a1408}

  .movers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:26px 0 22px}
  .mover{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .mover .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .mover .row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .mover .name{font-family:var(--display);font-weight:500;font-size:16px}
  .mover .name small{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px;font-family:var(--body)}
  .mover .val{font-family:var(--mono);font-weight:600;font-size:17px}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .phead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .ptitle{font-family:var(--display);font-weight:500;font-size:16px}
  .ptitle small{display:block;color:var(--muted);font-size:11.5px;font-weight:400;font-family:var(--body);margin-top:2px}
  .seg{display:flex;gap:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:3px}
  .seg button{background:none;border:none;color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:6px 11px;border-radius:6px;cursor:pointer;white-space:nowrap}
  .seg button.on{background:var(--gold);color:#1a1408;font-weight:600}

  /* diverging chart */
  #chart{padding:12px 18px 18px}
  .crow{display:grid;grid-template-columns:78px 1fr 66px;align-items:center;gap:12px;padding:4px 0}
  .clabel{display:flex;align-items:center;font-size:13px}
  .ctrack{position:relative;height:16px;background:linear-gradient(90deg,rgba(229,98,77,.06),rgba(229,98,77,.06) 49.6%,var(--line) 49.6%,var(--line) 50.4%,rgba(63,185,132,.06) 50.4%);border-radius:3px}
  .cbar{position:absolute;top:2px;height:12px;border-radius:2px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .cbar.up{background:var(--up)}.cbar.down{background:var(--down)}
  .cval{font-family:var(--mono);font-size:12.5px;font-weight:500;text-align:right}
  .cgap{text-align:center;color:var(--muted);font-family:var(--mono);font-size:11px;padding:8px 0;letter-spacing:.1em}

  .controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:26px 0 14px}
  .search{flex:1;min-width:200px;position:relative}
  .search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:var(--body);font-size:14px;padding:11px 14px 11px 38px;outline:none}
  .search input:focus{border-color:var(--gold)}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--muted);font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;padding:9px 13px;border-radius:999px;cursor:pointer;transition:.15s;user-select:none}
  .chip:hover{color:var(--text);border-color:var(--muted)}
  .chip.active{background:var(--gold);border-color:var(--gold);color:#1a1408;font-weight:600}

  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:660px}
  thead th{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;padding:14px 16px;font-weight:500;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--panel);cursor:pointer;user-select:none}
  thead th:first-child,thead th:nth-child(2){text-align:left}
  thead th:hover{color:var(--text)}
  thead th .arw{color:var(--gold);font-size:9px;margin-left:3px}
  tbody td{padding:12px 16px;border-bottom:1px solid rgba(38,50,74,.5);font-size:14px;text-align:right;white-space:nowrap}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:var(--panel-2)}
  .flag{font-size:17px;margin-right:9px;filter:saturate(1.1)}
  .code{font-family:var(--mono);font-weight:600;letter-spacing:.03em}
  td.cur{text-align:left}
  td.name{text-align:left;color:var(--muted);font-size:13px;max-width:260px;overflow:hidden;text-overflow:ellipsis}
  td.rate{font-family:var(--mono);font-weight:500}
  td.chg{font-family:var(--mono);font-weight:500}
  .up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--muted)}.na{color:#4a5670}
  .region-tag{font-size:9px;font-family:var(--mono);letter-spacing:.1em;color:var(--gold);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:8px;vertical-align:middle}

  .state{padding:60px 24px;text-align:center;color:var(--muted)}
  .state h3{font-family:var(--display);color:var(--text);font-weight:500;margin:0 0 8px}
  .spinner{width:26px;height:26px;border:2.5px solid var(--line);border-top-color:var(--gold);border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .btn{background:var(--gold);color:#1a1408;border:none;border-radius:9px;font-family:var(--body);font-weight:600;font-size:13px;padding:10px 18px;margin-top:16px;cursor:pointer}

  .foot{margin-top:18px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center}
  .foot .key{display:inline-flex;align-items:center;gap:6px}
  .foot .swatch{width:9px;height:9px;border-radius:2px;display:inline-block}
  .method{margin-top:14px;font-size:11.5px;color:#5c6a82;line-height:1.6}
  .count{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto}

  @media (max-width:600px){.movers{grid-template-columns:1fr}td.name{display:none}thead th:nth-child(2){display:none}.crow{grid-template-columns:66px 1fr 58px}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <div class="eyebrow" id="eyebrow">Daily FX · Reference rates</div>
      <h1 id="h1"></h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="lang">
      <button data-l="en" class="on">EN</button>
      <button data-l="uz">UZ</button>
    </div>
  </div>
  <div class="meta" id="meta"><span><span class="dot"></span><span id="loadingMeta">Loading…</span></span></div>

  <div class="movers" id="movers" style="display:none">
    <div class="mover"><div class="lbl" id="mv1">Strongest today</div><div class="row"><span class="name" id="topName">—</span><span class="val up" id="topVal">—</span></div></div>
    <div class="mover"><div class="lbl" id="mv2">Weakest today</div><div class="row"><span class="name" id="botName">—</span><span class="val down" id="botVal">—</span></div></div>
    <div class="mover"><div class="lbl" id="mv3">Currencies tracked</div><div class="row"><span class="name" id="cntName">—</span><span class="val" id="cntVal" style="color:var(--gold)">—</span></div></div>
  </div>

  <div class="panel">
    <div class="phead">
      <div class="ptitle" id="chartTitle">Ranked by change<small id="chartSub">Strongest at the top</small></div>
      <div class="seg" id="chartSeg">
        <button data-w="d1" class="on">1D</button>
        <button data-w="d7">1W</button>
        <button data-w="mtd">M</button>
        <button data-w="ytd">Y</button>
      </div>
    </div>
    <div id="chart"><div class="state"><div class="spinner"></div></div></div>
  </div>

  <div class="controls">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="text" placeholder="Search…">
    </div>
    <div class="chips" id="chips">
      <span class="chip active" data-f="all">All</span>
      <span class="chip" data-f="history">History</span>
      <span class="chip" data-f="ca">CA &amp; Caucasus</span>
    </div>
  </div>

  <div class="panel">
    <div class="scroll">
      <table id="tbl">
        <thead><tr>
          <th data-s="code" id="hCode">Code</th>
          <th data-s="name" id="hName">Currency</th>
          <th data-s="rate" id="hRate">Per 1 USD</th>
          <th data-s="d1">1 day <span class="arw" id="arw-d1"></span></th>
          <th data-s="d7">1 week <span class="arw" id="arw-d7"></span></th>
          <th data-s="mtd">Month <span class="arw" id="arw-mtd"></span></th>
          <th data-s="ytd">Year <span class="arw" id="arw-ytd"></span></th>
        </tr></thead>
        <tbody id="tbody"><tr><td colspan="7"><div class="state"><div class="spinner"></div></div></td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="foot">
    <span class="key"><span class="swatch" style="background:var(--up)"></span><span id="lgUp">Stronger vs USD</span></span>
    <span class="key"><span class="swatch" style="background:var(--down)"></span><span id="lgDown">Weaker vs USD</span></span>
    <span class="key"><span class="na">—</span>&nbsp;<span id="lgNa">No free history</span></span>
    <span class="count" id="rowCount"></span>
  </div>
  <p class="method" id="method"></p>
</div>

  NOK:"Norvegiya kronasi",DKK:"Daniya kronasi",SGD:"Singapur dollari",KRW:"Janubiy Koreya voni",INR:"Hindiston rupiyasi",
  MXN:"Meksika pesosi",BRL:"Braziliya reali",ZAR:"JAR rendi",TRY:"Turk lirasi",RUB:"Rossiya rubli",PLN:"Polsha zlotiyi",
  THB:"Tailand bati",IDR:"Indoneziya rupiyasi",HUF:"Vengriya forinti",CZK:"Chexiya kronasi",ILS:"Isroil shekeli",
  PHP:"Filippin pesosi",MYR:"Malayziya ringgiti",RON:"Ruminiya leyi",ISK:"Islandiya kronasi",BGN:"Bolgariya levi",
  AED:"BAA dirhami",SAR:"Saudiya riyoli",
  UZS:"O‘zbekiston so‘mi",KZT:"Qozog‘iston tengesi",KGS:"Qirg‘iziston somi",TJS:"Tojikiston somonisi",TMT:"Turkmaniston manati",
  AZN:"Ozarbayjon manati",GEL:"Gruziya larisi",AMD:"Armaniston drami",MNT:"Mo‘g‘uliston tugriki",AFN:"Afg‘on afg‘onisi",IRR:"Eron riali"
};
function flag(cc){if(!cc)return"🏳️";if(cc==="EU")return"🇪🇺";return cc.replace(/./g,c=>String.fromCodePoint(127397+c.charCodeAt(0)))}
function nameOf(code){if(lang==="uz"&&UZNAME[code])return UZNAME[code];return CUR[code]?CUR[code][0]:code}
function ccOf(code){return CUR[code]?CUR[code][1]:code.slice(0,2)}

/* ---------------- data ---------------- */
const OPEN="https://open.er-api.com/v6/latest/USD";
const NOW=new Date();const Y=NOW.getFullYear();
const FRANK=`https://api.frankfurter.dev/v1/${Y-1}-12-01..?base=USD`;
const ARCHIVE="./history.json";

let ROWS=[],filter="all",sortKey="d1",sortDir=-1,query="",chartWin="d1";

async function load(){
  try{
    const [openR,frankR,archR]=await Promise.all([
      fetch(OPEN).then(r=>r.json()),
      fetch(FRANK).then(r=>r.json()).catch(()=>null),
      fetch(ARCHIVE).then(r=>r.ok?r.json():null).catch(()=>null)
    ]);
    if(!openR||openR.result!=="success")throw new Error("feed");
    build(openR,frankR,archR);
    render();renderChart();stampMeta(openR);
  }catch(e){fail()}
}

function build(openR,frankR,archR){
  const openRates=openR.rates;
  const frankRates=(frankR&&frankR.rates)||{};
  const frankDates=Object.keys(frankRates).sort();
  const frankSet=frankDates.length?new Set(Object.keys(frankRates[frankDates[frankDates.length-1]])):new Set();
  const arch=archR||{};
  const archDates=Object.keys(arch).sort();

  const monthStart=`${Y}-${String(NOW.getMonth()+1).padStart(2,"0")}-01`;
  const yearStart=`${Y}-01-01`;
  const pct=(then,now)=>(then==null||now==null)?null:(then/now-1)*100; // + = currency stronger

  function seriesFor(code){
    // single source per currency: ECB for majors, else your archive
    let dts,src;
    if(frankSet.has(code)){dts=frankDates;src=frankRates;}
    else if(archDates.length){dts=archDates;src=arch;}
    else return null;
    const pts=[];
    for(const d of dts){const v=src[d]&&src[d][code];if(v!=null)pts.push([d,v]);}
    return pts.length?pts:null;
  }
  const lastBefore=(pts,cut)=>{let c=null;for(const[d,v]of pts){if(d<cut)c=v;else break;}return c;};
  const onOrBefore=(pts,cut)=>{let c=null;for(const[d,v]of pts){if(d<=cut)c=v;else break;}return c;};

  ROWS=Object.keys(openRates).filter(c=>c!=="USD").map(code=>{
    const s=seriesFor(code);
    let rate=openRates[code],d1=null,d7=null,mtd=null,ytd=null;
    if(s){
      const now=s[s.length-1][1];rate=now;
      const prev=s.length>1?s[s.length-2][1]:null;
      const lastDate=new Date(s[s.length-1][0]);const wk=new Date(lastDate);wk.setDate(wk.getDate()-7);
      d1=pct(prev,now);
      d7=pct(onOrBefore(s,wk.toISOString().slice(0,10)),now);
      mtd=pct(lastBefore(s,monthStart),now);
      ytd=pct(lastBefore(s,yearStart),now);
    }
    return{code,cc:ccOf(code),region:CA.has(code)?"ca":"",rate,d1,d7,mtd,ytd,has:!!s};
  });
}

/* ---------------- format ---------------- */
function fmtRate(v){if(v==null)return"—";if(v>=1000)return v.toLocaleString("en-US",{maximumFractionDigits:2});if(v>=1)return v.toLocaleString("en-US",{minimumFractionDigits:4,maximumFractionDigits:4});return v.toLocaleString("en-US",{minimumFractionDigits:5,maximumFractionDigits:6})}
function chgCell(v){if(v==null)return`<td class="chg na">—</td>`;const cls=v>0.005?"up":(v<-0.005?"down":"flat");const arw=v>0.005?"▲":(v<-0.005?"▼":"·");return`<td class="chg ${cls}">${arw} ${(v>0?"+":"")+v.toFixed(2)}%</td>`}

/* ---------------- render table ---------------- */
function render(){
  const tb=document.getElementById("tbody");
  let rows=ROWS.slice();
  if(filter==="history")rows=rows.filter(r=>r.has);
  else if(filter==="ca")rows=rows.filter(r=>r.region==="ca");
  if(query){const q=query.toLowerCase();rows=rows.filter(r=>r.code.toLowerCase().includes(q)||nameOf(r.code).toLowerCase().includes(q))}
  rows.sort((a,b)=>{let x=a[sortKey],y=b[sortKey];if(sortKey==="code"||sortKey==="name"){x=(sortKey==="name"?nameOf(a.code):a.code);y=(sortKey==="name"?nameOf(b.code):b.code);return sortDir*x.localeCompare(y)}if(x==null)return 1;if(y==null)return-1;return sortDir*(x-y)});
  if(!rows.length){
    tb.innerHTML=`<tr><td colspan="7"><div class="state"><h3>${t("noMatch")} “${query}”.</h3><div>${t("noMatchSub")}</div></div></td></tr>`;
  }else{
    tb.innerHTML=rows.map(r=>`<tr>
      <td class="cur"><span class="flag">${flag(r.cc)}</span><span class="code">${r.code}</span></td>
      <td class="name">${nameOf(r.code)}${r.region==="ca"?'<span class="region-tag">CCA</span>':''}</td>
      <td class="rate">${fmtRate(r.rate)}</td>
      ${chgCell(r.d1)}${chgCell(r.d7)}${chgCell(r.mtd)}${chgCell(r.ytd)}
    </tr>`).join("");
  }
  document.getElementById("rowCount").textContent=`${rows.length} ${t("shown")}`;
  ["d1","d7","mtd","ytd"].forEach(k=>{const el=document.getElementById("arw-"+k);if(el)el.textContent=sortKey===k?(sortDir<0?"▼":"▲"):""});
}

/* ---------------- render chart ---------------- */
function renderChart(){
  const box=document.getElementById("chart");
  let rows=ROWS.filter(r=>r[chartWin]!=null);
  if(filter==="ca")rows=rows.filter(r=>r.region==="ca");
  rows.sort((a,b)=>b[chartWin]-a[chartWin]);
  if(!rows.length){box.innerHTML=`<div class="state" style="padding:34px">${t("noChart")}</div>`;return}
  let gap=false;
  if(rows.length>26){const top=rows.slice(0,13),bot=rows.slice(-13);rows=top.concat([null]).concat(bot);gap=true}
  const vals=rows.filter(Boolean).map(r=>Math.abs(r[chartWin]));
  const maxAbs=Math.max(...vals,0.01);
  box.innerHTML=rows.map(r=>{
    if(r===null)return`<div class="cgap">· · ·</div>`;
    const v=r[chartWin],w=Math.abs(v)/maxAbs*50,pos=v>=0,left=pos?50:50-w,cls=pos?"up":"down";
    return`<div class="crow"><div class="clabel"><span class="flag">${flag(r.cc)}</span><span class="code">${r.code}</span></div>
    <div class="ctrack"><div class="cbar ${cls}" style="left:${left}%;width:${w}%"></div></div>
    <div class="cval ${cls}">${(v>0?"+":"")+v.toFixed(2)}%</div></div>`;
  }).join("");
}

/* ---------------- meta ---------------- */
function stampMeta(openR){
  const upd=openR.time_last_update_utc?new Date(openR.time_last_update_utc):new Date();
  const d=upd.toLocaleDateString(lang==="uz"?"uz":"en-GB",{day:"2-digit",month:"short",year:"numeric"});
  document.getElementById("meta").innerHTML=`<span><span class="dot"></span>${t("updated")} ${d}</span><span>${t("sources")}</span><span>${ROWS.length} ${t("ccy")}</span>`;
  const wd=ROWS.filter(r=>r.d1!=null).sort((a,b)=>b.d1-a.d1);
  document.getElementById("movers").style.display="grid";
  if(wd.length){const top=wd[0],bot=wd[wd.length-1];
    document.getElementById("topName").innerHTML=`${flag(top.cc)} ${top.code}<small>${nameOf(top.code)}</small>`;
    document.getElementById("topVal").textContent=(top.d1>0?"+":"")+top.d1.toFixed(2)+"%";
    document.getElementById("botName").innerHTML=`${flag(bot.cc)} ${bot.code}<small>${nameOf(bot.code)}</small>`;
    document.getElementById("botVal").textContent=bot.d1.toFixed(2)+"%";
  }
  document.getElementById("cntName").textContent=t("live");
  document.getElementById("cntVal").textContent=ROWS.length;
}

function fail(){
  document.getElementById("meta").innerHTML=`<span style="color:var(--down)">● Offline</span>`;
  document.getElementById("tbody").innerHTML=`<tr><td colspan="7"><div class="state"><h3>${t("failH")}</h3><div>${t("failSub")}</div><button class="btn" onclick="location.reload()">${t("retry")}</button></div></td></tr>`;
  document.getElementById("chart").innerHTML=`<div class="state" style="padding:34px">${t("failSub")}</div>`;
}

/* ---------------- apply language to static chrome ---------------- */
function applyLang(){
  document.documentElement.lang=lang;
  document.getElementById("eyebrow").textContent=t("eyebrow");
  document.getElementById("h1").innerHTML=t("h1");
  document.getElementById("sub").textContent=t("sub");
  document.getElementById("loadingMeta")&&(document.getElementById("loadingMeta").textContent=t("loading"));
  document.getElementById("mv1").textContent=t("mv1");
  document.getElementById("mv2").textContent=t("mv2");
  document.getElementById("mv3").textContent=t("mv3");
  document.getElementById("chartTitle").innerHTML=`${t("chartTitle")}<small id="chartSub">${t("chartSub")}</small>`;
  document.getElementById("q").placeholder=t("search");
  const cf={all:"fAll",history:"fHist",ca:"fCa"};
  document.querySelectorAll("#chips .chip").forEach(c=>c.textContent=t(cf[c.dataset.f]));
  document.getElementById("hCode").firstChild.textContent=t("hCode");
  document.getElementById("hName").firstChild.textContent=t("hName");
  document.getElementById("hRate").firstChild.textContent=t("hRate");
  const hh={d1:"hDay",d7:"hWeek",mtd:"hMonth",ytd:"hYear"};
  document.querySelectorAll("thead th[data-s]").forEach(th=>{const k=th.dataset.s;if(hh[k]){th.childNodes[0].textContent=t(hh[k])+" "}});
  document.getElementById("lgUp").textContent=t("lgUp");
  document.getElementById("lgDown").textContent=t("lgDown");
  document.getElementById("lgNa").textContent=t("lgNa");
  document.getElementById("method").innerHTML=t("method");
}

/* ---------------- events ---------------- */
document.querySelector(".lang").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;lang=b.dataset.l;document.querySelectorAll(".lang button").forEach(x=>x.classList.toggle("on",x===b));applyLang();if(ROWS.length){render();renderChart();document.getElementById("cntName").textContent=t("live")}});
document.getElementById("q").addEventListener("input",e=>{query=e.target.value.trim();render()});
document.getElementById("chips").addEventListener("click",e=>{const c=e.target.closest(".chip");if(!c)return;filter=c.dataset.f;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x===c));render();renderChart()});
document.getElementById("chartSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;chartWin=b.dataset.w;document.querySelectorAll("#chartSeg button").forEach(x=>x.classList.toggle("on",x===b));renderChart()});
document.querySelectorAll("thead th").forEach(th=>{th.addEventListener("click",()=>{const k=th.dataset.s;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=(k==="code"||k==="name")?1:-1}render()})});

applyLang();load();
</script>
