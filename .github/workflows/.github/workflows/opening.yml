name: UZCE opening auction

on:
  schedule:
    - cron: '30 5 * * 1-5'   # 05:30 UTC = 10:30 Tashkent, weekdays (after the auction opens)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  opening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch the opening auction rate
        run: python fetch_opening.py
      - name: Commit opening.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add opening.json
          git diff --staged --quiet || git commit -m "opening: $(date -u +%F) [skip ci]"
          git push
